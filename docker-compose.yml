services:
  nginx:
    image: bestzwei/libretv:latest
    volumes:
      - ./:/usr/share/nginx/html
    ports:
      - "1880:80"
    environment:
      - PASSWORD=12345678
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/",
          "||",
          "exit",
          "1",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
